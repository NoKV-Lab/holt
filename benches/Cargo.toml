[package]
name = "holt-bench"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
publish = false

[workspace]

[dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
holt = { path = ".." }
rand = "0.9"
tempfile = "3"
rocksdb = { version = "0.24", default-features = false, optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
sled = { version = "0.34", optional = true }
heed = { version = "0.20", optional = true }
redb = { version = "2", optional = true }
postgres = { version = "0.19", optional = true }

[features]
default = ["comparators"]
comparators = ["dep:rocksdb", "dep:rusqlite", "dep:sled", "dep:heed", "dep:redb"]
pg = ["dep:postgres"]
io-uring = ["holt/io-uring"]

[[bench]]
name = "regression"
harness = false
path = "regression.rs"

[[bench]]
name = "cow_snapshot"
harness = false
path = "cow_snapshot.rs"

[[bench]]
name = "main"
harness = false
path = "main.rs"

[[bench]]
name = "ycsb"
harness = false
path = "ycsb.rs"

[[bench]]
name = "ai_meta"
harness = false
path = "ai_meta.rs"

[[bench]]
name = "stress"
harness = false
path = "stress.rs"

[[bench]]
name = "concurrent"
harness = false
path = "concurrent.rs"

[[bench]]
name = "longest_prefix"
harness = false
path = "longest_prefix.rs"

[[bench]]
name = "longest_prefix_concurrent"
harness = false
path = "longest_prefix_concurrent.rs"
